version: '3.9'
services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/bitnami/kafka

  app:
    build: .
    depends_on:
      - kafka
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST_DEVELOPMENT: ${DB_HOST_DEVELOPMENT}
      DB_PORT_DEVELOPMENT: ${DB_PORT_DEVELOPMENT:-5432}
      DB_USERNAME_DEVELOPMENT: ${DB_USERNAME_DEVELOPMENT}
      DB_PASSWORD_DEVELOPMENT: ${DB_PASSWORD_DEVELOPMENT}
      DB_DATABASE_DEVELOPMENT: ${DB_DATABASE_DEVELOPMENT}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-100kb}
      # Kafka client configs for node-rdkafka
      KAFKA_BROKERS: kafka:9092
    ports:
      - "4000:4000"
    command: ["npm", "run", "dev"]

volumes:
  kafkadata:

