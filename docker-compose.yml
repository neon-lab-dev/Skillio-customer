version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE_DEVELOPMENT:-skilio}
      POSTGRES_USER: ${DB_USERNAME_DEVELOPMENT:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD_DEVELOPMENT:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/bitnami/kafka

  app:
    build: .
    depends_on:
      - postgres
      - kafka
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST_DEVELOPMENT: postgres
      DB_PORT_DEVELOPMENT: 5432
      DB_USERNAME_DEVELOPMENT: ${DB_USERNAME_DEVELOPMENT:-postgres}
      DB_PASSWORD_DEVELOPMENT: ${DB_PASSWORD_DEVELOPMENT:-postgres}
      DB_DATABASE_DEVELOPMENT: ${DB_DATABASE_DEVELOPMENT:-skilio}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changeme}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-100kb}
      # Kafka client configs for node-rdkafka
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3000:3000"
    command: ["npm", "run", "build:dev"]

volumes:
  pgdata:
  kafkadata:


